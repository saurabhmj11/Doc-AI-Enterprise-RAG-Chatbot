# Render Blueprint - Deploy with one click
# https://render.com/docs/blueprint-spec

services:
  # Backend API
  - type: web
    name: doc-ai-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_lg
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: GEMINI_API_KEY
        sync: false           # Set in Render dashboard
      - key: SECRET_KEY
        sync: false           # Generate: python -c "import secrets; print(secrets.token_hex(32))"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false           # Set a strong password in Render dashboard
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_DEPARTMENT
        value: Platform Engineering
      - key: ADMIN_DESIGNATION
        value: AI/ML Engineer
      - key: ENABLE_HYBRID_SEARCH
        value: "true"
      - key: ENABLE_RERANKING
        value: "true"
      - key: ENABLE_QUERY_EXPANSION
        value: "true"
      - key: ENABLE_HYDE
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health

  # Frontend Static Site
  - type: web
    name: doc-ai-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: doc-ai-backend-bpez.onrender.com
